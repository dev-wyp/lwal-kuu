project_id = "myanmar-wholesale-erp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false

[functions.marketing-ai]
verify_jwt = true

[functions.marketing-oauth]
verify_jwt = false

[functions.marketing-publish]
verify_jwt = false

[functions.marketing-jobs]
verify_jwt = false
